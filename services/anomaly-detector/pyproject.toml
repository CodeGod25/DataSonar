[project]
name = "datasonar-anomaly-detector"
version = "1.0.0"
description = "DataSonar anomaly detection — terminal CLI"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn==1.6.1",
    "pandas==2.2.3",
    "numpy==2.2.1",
    "pydantic==2.10.4",
    "joblib==1.4.2",
    "rich==13.9.4",
    "python-dotenv==1.0.1",
]

[project.scripts]
anomaly-detector = "app.main:main"

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-mock==3.14.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
